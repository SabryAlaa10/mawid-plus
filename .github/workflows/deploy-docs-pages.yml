# ينشر محتويات docs/ إلى فرع gh-pages لاستضافة GitHub Pages.
# مرة واحدة من المستودع: Settings → Pages → Source: Branch gh-pages / folder / (root)
name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
      - rewrite/sabry-web-auth
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs-pages.yml"

permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish docs to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: false
